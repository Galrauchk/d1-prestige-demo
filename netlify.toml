[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ancienne adresse Netlify : 301 vers le sous-domaine de webtrafic.fr (chantier 310, 08/10/2026).
[[redirects]]
  from = "https://d1-prestige-demo.netlify.app/*"
  to = "https://demo-prestige.webtrafic.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

